log_format f2_sanitized '$remote_addr gate="$arg_f2_gate" origin="$http_origin" $request_method $uri $status';
access_log /var/log/nginx/access.log f2_sanitized;

server {
  listen 443 ssl;
  server_name localhost;
  ssl_certificate /etc/nginx/tls/localhost.crt;
  ssl_certificate_key /etc/nginx/tls/localhost.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location /api/ {
    proxy_pass http://host.docker.internal:5000;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port 8443;
  }

  location ~ ^/(realms|resources|robots.txt)/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port 8443;
  }

  location / {
    proxy_pass http://host.docker.internal:3100;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto https;
  }
}
