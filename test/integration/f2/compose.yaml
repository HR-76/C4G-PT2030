name: c4g-f2-integration
services:
  central-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: c4g_central
      POSTGRES_PASSWORD: ${F2_CENTRAL_PASSWORD}
      POSTGRES_DB: c4g_central
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports: ["127.0.0.1:5441:5432"]
    volumes:
      - central-data:/var/lib/postgresql/data
      - ./central-marker.sql:/docker-entrypoint-initdb.d/00-marker.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c4g_central -d c4g_central"]
      interval: 2s
      timeout: 3s
      retries: 30

  legacy-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: c4g_legacy
      POSTGRES_PASSWORD: ${F2_LEGACY_PASSWORD}
      POSTGRES_DB: c4g_legacy
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports: ["127.0.0.1:5442:5432"]
    volumes:
      - legacy-data:/var/lib/postgresql/data
      - ../../../backend/database/init.sql:/docker-entrypoint-initdb.d/00-legacy.sql:ro
      - ./legacy-synthetic.sql:/docker-entrypoint-initdb.d/01-legacy-synthetic.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c4g_legacy -d c4g_legacy"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: f2-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${F2_KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://localhost:8443
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      F2_USER_PASSWORD: ${F2_USER_PASSWORD}
      F2_ADMIN_PASSWORD: ${F2_ADMIN_PASSWORD}
      F2_ADMIN_TOTP_SECRET: ${F2_ADMIN_TOTP_SECRET}
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./realm.json:/opt/keycloak/data/import/c4g-test-realm.json:ro
      - ../../../dev/keycloak/themes/c4g:/opt/keycloak/themes/c4g:ro

  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8443:443", "127.0.0.1:8444:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${F2_SECRET_DIR}/localhost.crt:/etc/nginx/tls/localhost.crt:ro
      - ${F2_SECRET_DIR}/localhost.key:/etc/nginx/tls/localhost.key:ro
    depends_on: [keycloak]

volumes:
  central-data:
  legacy-data:
