log_format doc_mvp01_sanitized '$remote_addr $request_method $uri $status';
access_log /var/log/nginx/access.log doc_mvp01_sanitized;

server {
  listen 443 ssl;
  server_name localhost;
  ssl_certificate /etc/nginx/tls/localhost.crt;
  ssl_certificate_key /etc/nginx/tls/localhost.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  location /api/ {
    proxy_pass http://host.docker.internal:5100;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port 8543;
    client_max_body_size 100m;
    proxy_request_buffering off;
  }

  location ~ ^/(realms|resources|robots.txt)/ {
    proxy_pass http://idp:8080;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Port 8543;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
  }
}
