name: c4g-production-app

# Candidate application stack. PostgreSQL/Keycloak and these networks must be provisioned separately.
# No service starts without an explicit profile. Images and configuration are release-bound.
services:
  pod:
    profiles: [release]
    image: ${C4G_PRODUCTION_POD_IMAGE:?immutable pod image digest required}
    init: true
    restart: unless-stopped
    command: [sleep, infinity]
    ports: ["127.0.0.1:8600:5000"]
    networks:
      edge: {}
      data: {}
      identity:
        aliases: [c4g-activation-bridge]
    mem_limit: 64m
    pids_limit: 64
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  api:
    profiles: [release]
    image: ${C4G_PRODUCTION_IMAGE:?immutable application image digest required}
    init: true
    restart: unless-stopped
    network_mode: service:pod
    depends_on:
      pod: {condition: service_started}
      clamav: {condition: service_healthy}
    env_file:
      - path: /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/api.env
        format: raw
      - path: /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/central-runtime.env
        format: raw
      - path: /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/api-features.env
        format: raw
    environment: {NODE_EXTRA_CA_CERTS: /certs/ca.pem}
    volumes:
      - /srv/c4g-production/postgres/certs/ca.pem:/certs/ca.pem:ro
      - /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/member-http.json:/run/private/members/http.json:ro
      - /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/member-worker.json:/run/private/members/worker.json:ro
    read_only: true
    tmpfs: [/tmp:size=128m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/health/ready',{signal:AbortSignal.timeout(15000)}).then(async r=>{const b=await r.json();process.exit(r.status===200&&b.status==='READY'?0:1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
    logging: *logging

  clamav:
    profiles: [release]
    image: ${C4G_PRODUCTION_CLAMAV_IMAGE:?immutable scanner image digest required}
    restart: unless-stopped
    network_mode: service:pod
    depends_on: {pod: {condition: service_started}}
    volumes: [clamav-db:/var/lib/clamav]
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: [CMD-SHELL, clamdcheck.sh]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging: *logging

  bootstrap:
    profiles: [bootstrap]
    image: ${C4G_PRODUCTION_IMAGE:?immutable application image digest required}
    restart: "no"
    # New installation only. The default remains a read-only plan; append --apply explicitly.
    command: [node, scripts/installProductionPlatform.js, --config, /run/private/bootstrap.config.json, --credentials, /run/private/bootstrap.credentials.json, --runtime-config, /run/private/runtime.config.json, --runtime-credentials, /run/private/runtime.credentials.json, --output-dir, /run/output]
    env_file:
      - path: /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/bootstrap.env
        format: raw
    environment: {NODE_EXTRA_CA_CERTS: /certs/ca.pem}
    volumes:
      - /srv/c4g-production/postgres/certs/ca.pem:/certs/ca.pem:ro
      - /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/bootstrap.config.json:/run/private/bootstrap.config.json:ro
      - /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/bootstrap.credentials.json:/run/private/bootstrap.credentials.json:ro
      - /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/runtime.config.json:/run/private/runtime.config.json:ro
      - /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/runtime.credentials.json:/run/private/runtime.credentials.json:ro
      - /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/bootstrap-output:/run/output:rw
    networks: [data, identity]
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    logging: *logging

  migrate:
    profiles: [maintenance]
    image: ${C4G_PRODUCTION_IMAGE:?immutable application image digest required}
    restart: "no"
    # Default is a target/plan check. --apply must be supplied explicitly in a one-shot run.
    command: [node, scripts/installProductionCentral.js, --expected-database, c4g_central_production]
    env_file:
      - path: /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/install.env
        format: raw
    environment: {NODE_EXTRA_CA_CERTS: /certs/ca.pem}
    volumes:
      - /srv/c4g-production/postgres/certs/ca.pem:/certs/ca.pem:ro
      - /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/central-logins.json:/run/private/central-logins.json:ro
    networks: [data]
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    logging: *logging

  retention:
    profiles: [retention]
    image: ${C4G_PRODUCTION_IMAGE:?immutable application image digest required}
    restart: "no"
    command: [node, src/emailTemplates/retentionWorker.js]
    env_file:
      - path: /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/retention-runtime.env
        format: raw
    environment: {NODE_EXTRA_CA_CERTS: /certs/ca.pem}
    volumes: [/srv/c4g-production/postgres/certs/ca.pem:/certs/ca.pem:ro]
    networks: [data]
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging: *logging

  billing-mail:
    profiles: [billing-mail]
    image: ${C4G_PRODUCTION_IMAGE:?immutable application image digest required}
    init: true
    restart: unless-stopped
    command: [node, src/billingValidation/workerMain.js]
    env_file:
      - path: /srv/c4g-production/config/${C4G_PRODUCTION_CONFIG:?configuration id required}/billing-mail.env
        format: raw
    environment: {NODE_EXTRA_CA_CERTS: /certs/ca.pem}
    volumes: [/srv/c4g-production/postgres/certs/ca.pem:/certs/ca.pem:ro]
    networks: [data]
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 30s
    logging: *logging

volumes:
  clamav-db:
    name: c4g-production-clamav-db
networks:
  edge: {}
  data: {external: true, name: c4g-production-data}
  identity: {external: true, name: c4g-production-identity}
