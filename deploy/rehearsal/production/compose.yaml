name: ${C4G_REHEARSAL_PROJECT:?owned unique rehearsal project required}

# Disposable local acceptance only. No host port, external network, or production input.
services:
  prepare:
    profiles: [rehearsal]
    image: ${C4G_REHEARSAL_GATE_IMAGE:?locally built immutable gate image required}
    user: "0:0"
    command: [node, /app/test/integration/production-bootstrap/docker.cjs, prepare]
    network_mode: none
    volumes: [secrets:/run/private, evidence:/evidence]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    restart: "no"

  postgres:
    profiles: [rehearsal]
    image: ${C4G_REHEARSAL_POSTGRES_IMAGE:?immutable PostgreSQL18 image required}
    environment:
      POSTGRES_USER: bootstrap_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256 --encoding=UTF8 --locale=C
    networks: [isolated]
    volumes: [postgres-data:/var/lib/postgresql, secrets:/run/secrets:ro]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bootstrap_admin -d postgres]
      interval: 2s
      timeout: 5s
      retries: 45
    mem_limit: 1g
    pids_limit: 128
    restart: "no"

  gate:
    profiles: [rehearsal]
    image: ${C4G_REHEARSAL_GATE_IMAGE:?locally built immutable gate image required}
    command: [node, /app/test/integration/production-bootstrap/docker.cjs, run]
    environment:
      C4G_REHEARSAL_MODE: ${C4G_REHEARSAL_MODE:?fresh or full required}
    network_mode: service:postgres
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [secrets:/run/private:ro, evidence:/evidence]
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    restart: "no"

networks:
  isolated: {internal: true}
volumes:
  postgres-data: {}
  secrets: {}
  evidence: {}
